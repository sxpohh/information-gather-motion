<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2400" viewBox="0 0 1200 2400">
<rect width="1200" height="2400" fill="#f8f9fe"/><g font-family="Noto Sans SC, sans-serif" fill="#242440"><text x="85" y="115" font-size="40">9:41</text><text x="85" y="280" font-size="78" font-weight="700">灵感收件箱</text><text x="85" y="365" font-size="39" fill="#7a7b91">先记下来，之后慢慢想</text><rect x="75" y="460" width="1050" height="130" rx="38" fill="#e8e8fb"/><text x="120" y="545" font-size="42" fill="#66699b">刚刚想到了什么？</text>
<rect x="75" y="665" width="1050" height="395" rx="42" fill="#eeebfc"/><text x="125" y="765" font-size="36" fill="#7772aa">一个点子</text><text x="125" y="875" font-size="55" font-weight="700">让介绍围绕重点展开</text><text x="125" y="965" font-size="39" fill="#777a94">把真正想说的，写在最前面。</text>
<rect x="75" y="1110" width="1050" height="390" rx="42" fill="#e8f1f2"/><text x="125" y="1210" font-size="36" fill="#65858c">阅读记录</text><text x="125" y="1320" font-size="55" font-weight="700">给好想法留个位置</text><text x="125" y="1410" font-size="39" fill="#6e898f">不用现在整理，先保存下来。</text>
<rect x="75" y="1580" width="1050" height="275" rx="42" fill="white" stroke="#e3e5ef" stroke-width="3"/><text x="125" y="1685" font-size="45">待整理</text><text x="125" y="1775" font-size="36" fill="#8a8b9d">灵感、摘录和一闪而过的念头</text><text x="85" y="2260" font-size="40" fill="#8a8b9d">今日　　　　　灵感　　　　　我的</text><text x="85" y="2350" font-size="27" fill="#a3a4b4">模板示意 · 非真实产品</text></g></svg>
