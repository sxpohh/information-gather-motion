<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>框选镜头重点</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f6f4ee;color:#29271f;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;display:grid;grid-template-columns:minmax(220px,460px) 1fr;gap:32px}h1{font-size:26px}select,button,textarea{font:inherit;border:1px solid #bfc7c3;border-radius:8px;padding:10px;background:white}select{width:100%;margin-bottom:16px}#surface{position:relative;touch-action:none;user-select:none;cursor:crosshair;width:100%}img{display:block;width:100%;pointer-events:none}#rect{position:absolute;border:3px solid #177b74;background:#177b7425;pointer-events:none;display:none}textarea{display:block;width:100%;height:100px;margin:20px 0;resize:vertical}#size{color:#676c65}a{color:#28675f}@media(max-width:650px){body{padding:18px}main{grid-template-columns:1fr}}
</style></head><body><main><section><select id="screen" aria-label="选择截图"></select><div id="surface"><img id="image" alt=""><div id="rect"></div></div></section><section><h1>框选镜头重点</h1><p>在截图上拖选，把 rect 复制到产品配置。</p><p id="size"></p><textarea id="value" aria-label="归一化重点矩形" readonly>[0, 0, 1, 1]</textarea><button id="copy">复制 rect</button><p id="feedback" role="status"></p><a href="player.html">返回预览</a></section></main><script src="config.js"></script><script>
const c=window.INFORMATION_GATHER_CONFIG,select=document.getElementById('screen'),image=document.getElementById('image'),surface=document.getElementById('surface'),box=document.getElementById('rect'),value=document.getElementById('value');let start=null;
for(const s of c.screens){const o=document.createElement('option');o.value=s.id;o.textContent=s.alt;select.append(o);}function show(){const s=c.screens.find(s=>s.id===select.value);image.src=s.src;image.alt=s.alt;box.style.display='none';value.value='[0, 0, 1, 1]';}select.onchange=show;image.onload=()=>document.getElementById('size').textContent=image.naturalWidth+' × '+image.naturalHeight+' px';show();
const point=e=>{const r=surface.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.x)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.y)/r.height))};};surface.onpointerdown=e=>{start=point(e);surface.setPointerCapture(e.pointerId);};surface.onpointermove=e=>{if(!start)return;const p=point(e),x=Math.min(p.x,start.x),y=Math.min(p.y,start.y),w=Math.abs(p.x-start.x),h=Math.abs(p.y-start.y);Object.assign(box.style,{display:'block',left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%'});value.value=JSON.stringify([x,y,w,h].map(n=>Math.round(n*10000)/10000));};surface.onpointerup=()=>{start=null;};surface.onpointercancel=()=>{start=null;};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(value.value);document.getElementById('feedback').textContent='已复制';}catch{value.select();document.getElementById('feedback').textContent='请按 Ctrl+C 复制';}};
</script></body></html>
